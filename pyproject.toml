[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeso-regimes"
version = "0.1.0"
description = "Classify Alberta pool price regimes from public AESO data"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
